# local-agent 설정 예시. 복사해서 config.yaml로 저장한 뒤 실제 환경값으로 채우세요.
# config.yaml은 .gitignore에 등록해 실제 경로/자격증명이 저장소에 올라가지 않게 하세요.

google_sheets:
  # Google Cloud 서비스 계정 키 파일 경로. 이 서비스 계정 이메일을
  # "RPA_원천세" 스프레드시트에 "편집자"로 공유해야 함 (처리로그 시트를 만들고 써야 하므로).
  service_account_json: "C:/secure/service-account.json"
  # "RPA_원천세" 스프레드시트 ID (URL의 /d/ 뒤 문자열).
  spreadsheet_id: "CHANGE_ME"
  # 급여자료가 있는 워크시트(탭) 이름. 열 구성: 회사명/사업자등록번호/이름/급여구분/금액
  # (필요하면 주민등록번호, 입사일 등 임의 컬럼을 추가하고 아래 field_control_ids에서 참조 가능)
  data_sheet_name: "시트1"
  # 처리 결과(완료/오류)를 기록할 시트 이름. 없으면 자동으로 생성함.
  log_sheet_name: "처리로그"

setax_pro:
  # 세무사랑 Pro 실행 파일 경로 (프로그램이 이미 켜져 있으면 attach만 시도)
  exe_path: "C:/Program Files (x86)/한국세무사회/세무사랑Pro/SetaxPro.exe"
  # pywinauto가 창을 찾을 때 쓰는 제목 정규식.
  window_title_regex: ".*세무사랑.*"
  backend: "uia"  # 대부분의 최신 Windows 프로그램은 uia, 구형 win32 프로그램이면 "win32"로 변경

  # 안전장치: true면 실제 화면 입력 없이 어떤 동작을 할지 로그만 남긴다.
  # 처음 세팅할 때는 반드시 true로 먼저 검증할 것.
  dry_run: true

  # 아래 메뉴 경로/컨트롤ID는 전부 placeholder다.
  # inspect_controls.py로 세무사랑 Pro 실제 화면을 열어 확인한 뒤 CHANGE_ME를 실제 값으로 바꿔야 동작한다.

  # 회사 변경 (자료에 등장하는 회사를 순서대로 처리하기 위해 매 회사 시작 시 호출)
  company_switch:
    menu_path: "회사등록|회사변경"
    search_input_control_id: "CHANGE_ME"   # 사업자등록번호 검색창
    confirm_button_control_id: "CHANGE_ME"

  # 급여구분(구글시트 "급여구분" 컬럼 값)별 화면 설정.
  #
  # 등록/급여자료입력 화면은 개별 입력창이 아니라 fpUSpread80이라는 스프레드시트형
  # 그리드 컨트롤 하나로 되어 있어(사원등록 화면 확인됨), 필드별 컨트롤ID를 지정하는
  # 방식이 통하지 않는다. 대신 grid_entry로 "그리드에 포커스 -> 값 타이핑 -> 확정키
  # (enter/tab)로 다음 칸 이동"을 사람이 입력하듯 순서대로 재현한다.
  #
  # grid_entry.initial_focus_keys: 화면을 처음 열었을 때 그리드를 한 번 클릭한 뒤
  # 눌러야 하는 키. 사원등록 기준으로는 "마우스로 첫 사번 칸을 클릭"이 필요하다고
  # 확인됐지만, 그 클릭 좌표가 화면/회사(기존 등록 인원 수)에 따라 달라질 수 있어
  # 좌표 대신 키 입력으로 대체할 방법(예: Ctrl+End 후 아래 화살표로 마지막 빈 행 이동)을
  # 실제 화면에서 테스트해 채워야 한다. 클릭만으로 충분하면 빈 문자열로 둔다.
  # grid_entry.fields: 순서대로 입력할 컬럼과, 입력 후 다음 칸으로 넘어가는 확정키
  # (enter 또는 tab). 마지막 필드의 확정키가 다음 "새 사람" 행으로 넘어가는 키다.
  income_types:
    1_정규직근로자:
      tab_menu_path: "인사급여|근로소득관리"
      register:
        menu_path: "사원등록"
        grid_entry:
          grid_control_class_name: "fpUSpread80"
          initial_focus_keys: ""   # 클릭만으로 첫 빈 행 사번 칸에 포커스가 가는지 확인 필요
          fields:
            - {column: "사번", commit_key: "enter"}
            - {column: "이름", commit_key: "enter"}
            - {column: "내외국인구분", commit_key: "enter", default: "1"}   # 1=내국인, 2=외국인
            - {column: "주민등록번호", commit_key: "tab"}   # tab -> 다음 사람 사번 칸으로 자동 이동
      payroll:
        # 급여자료입력도 같은 종류의 그리드 화면일 가능성이 높지만 아직 실제 화면에서
        # 필드 순서/확정키를 확인하지 못했다. inspect_controls.py + 직접 입력 테스트로
        # 사원등록과 같은 방식으로 확인한 뒤 아래 fields를 채울 것.
        menu_path: "급여자료입력"
        grid_entry:
          grid_control_class_name: "fpUSpread80"
          initial_focus_keys: ""
          fields:
            - {column: "사번", commit_key: "CHANGE_ME"}
            - {column: "금액", commit_key: "CHANGE_ME"}
        close_button_control_id: "CHANGE_ME"   # 마감

    2_일용직근로자:
      tab_menu_path: "인사급여|일용직근로소득관리"
      register:
        menu_path: "일용직사원등록"
        grid_entry:
          grid_control_class_name: "fpUSpread80"
          initial_focus_keys: ""
          fields:
            - {column: "사번", commit_key: "CHANGE_ME"}
            - {column: "이름", commit_key: "CHANGE_ME"}
      payroll:
        menu_path: "일용직급여자료일괄입력"
        grid_entry:
          grid_control_class_name: "fpUSpread80"
          initial_focus_keys: ""
          fields:
            - {column: "사번", commit_key: "CHANGE_ME"}
            - {column: "금액", commit_key: "CHANGE_ME"}
        close_button_control_id: "CHANGE_ME"   # 마감

    3_사업소득자:
      tab_menu_path: "인사급여|사업소득관리"
      register:
        menu_path: "사업소득자등록"
        grid_entry:
          grid_control_class_name: "fpUSpread80"
          initial_focus_keys: ""
          fields:
            - {column: "사번", commit_key: "CHANGE_ME"}
            - {column: "이름", commit_key: "CHANGE_ME"}
      payroll:
        menu_path: "사업소득자료입력"
        grid_entry:
          grid_control_class_name: "fpUSpread80"
          initial_focus_keys: ""
          fields:
            - {column: "사번", commit_key: "CHANGE_ME"}
            - {column: "금액", commit_key: "CHANGE_ME"}
        close_button_control_id: "CHANGE_ME"   # 마감

    4_기타소득자:
      tab_menu_path: "인사급여|기타소득관리"
      register:
        menu_path: "기타소득자(이자배당)등록"
        grid_entry:
          grid_control_class_name: "fpUSpread80"
          initial_focus_keys: ""
          fields:
            - {column: "사번", commit_key: "CHANGE_ME"}
            - {column: "이름", commit_key: "CHANGE_ME"}
      payroll:
        menu_path: "기타소득자료입력"
        grid_entry:
          grid_control_class_name: "fpUSpread80"
          initial_focus_keys: ""
          fields:
            - {column: "사번", commit_key: "CHANGE_ME"}
            - {column: "금액", commit_key: "CHANGE_ME"}
        close_button_control_id: "CHANGE_ME"   # 마감

  # 회사 하나의 급여구분별 처리가 모두 끝난 뒤 실행: 세무신고서류 작성 -> 마감
  tax_filing:
    tab_menu_path: "세무신고서류"
    withholding_report:
      menu_path: "원천징수이행상황신고서"
      create_button_control_id: "CHANGE_ME"
    local_income_tax:
      menu_path: "지방소득세납부서(명세서)"
      current_company_filter_control_id: "CHANGE_ME"  # "현재회사" 필터/탭 (없으면 빈 문자열로 두면 건너뜀)
      calculation_button_control_id: "CHANGE_ME"       # 지방소득세 계산서
      payment_button_control_id: "CHANGE_ME"           # 납부서
    close_button_control_id: "CHANGE_ME"  # 마감
